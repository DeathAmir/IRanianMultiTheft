name: Windows Build

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/irantheft.exe dist/irantheft.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: IRanianMultiTheft-Windows-x64
          path: dist/irantheft.exe
          if-no-files-found: error
          retention-days: 14
