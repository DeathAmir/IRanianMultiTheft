name: IRAntheft Windows x64 Setup

'on':
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build game on Windows and create NSIS installer
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
            C:\vcpkg\buildtrees
          key: windows-vcpkg-openssl-${{ runner.os }}-x64-v1
          restore-keys: |
            windows-vcpkg-openssl-${{ runner.os }}-x64-

      - name: Install OpenSSL
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install openssl:x64-windows-static

      - name: Configure Windows x64 game
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DVCPKG_HOST_TRIPLET=x64-windows -DOPENSSL_ROOT_DIR="$env:VCPKG_ROOT/installed/x64-windows-static"

      - name: Compile game and tools on Windows
        run: cmake --build build --config Release --parallel

      - name: Stage game files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force launcher-resources/game | Out-Null
          Copy-Item build/Release/irantheft.exe launcher-resources/game/
          Copy-Item build/game.iremg launcher-resources/game/
          Copy-Item build/assets launcher-resources/game/ -Recurse
          Copy-Item build/Release/ires_editor.exe launcher-resources/game/
          Copy-Item build/Release/ires_packer.exe launcher-resources/game/
          Copy-Item build/Release/ires_signer.exe launcher-resources/game/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install Tauri dependencies
        working-directory: launcher-ui
        run: npm install

      - name: Build Tauri launcher and NSIS installer
        working-directory: launcher-ui
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: IRAntheft-Windows-x64-Setup
          path: launcher-ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
