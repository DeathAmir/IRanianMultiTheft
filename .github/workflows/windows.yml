name: IRAntheft Windows x64 Setup

'on':
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build game on Windows and create NSIS installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache prebuilt OpenSSL package
        uses: actions/cache@v4
        with:
          path: .deps/openssl-native
          key: openssl-native-3.5.9-windows-x64-vc143

      - name: Install prebuilt OpenSSL libraries
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE ".deps/openssl-native"
          if (!(Test-Path $root)) {
            New-Item -ItemType Directory -Force $root | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP "openssl-native.3.5.9.nupkg"
            Invoke-WebRequest "https://www.nuget.org/api/v2/package/openssl-native/3.5.9" -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath $root -Force
          }
          $header = Get-ChildItem $root -Recurse -File -Filter opensslv.h | Select-Object -First 1
          $libraries = Get-ChildItem $root -Recurse -File -Filter "*crypto*.lib"
          $crypto = $libraries | Where-Object { $_.FullName -match "vc143" -and $_.FullName -match "static" } | Select-Object -First 1
          if (!$crypto) { $crypto = $libraries | Where-Object { $_.FullName -match "vc143" } | Select-Object -First 1 }
          if (!$crypto) { $crypto = $libraries | Where-Object { $_.Name -match "static" } | Select-Object -First 1 }
          if (!$header -or !$crypto) {
            Get-ChildItem $root -Recurse -File | Select-Object -ExpandProperty FullName
            throw "Prebuilt OpenSSL headers or VC143 crypto library were not found."
          }
          "OPENSSL_INCLUDE_DIR=$($header.Directory.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_CRYPTO_LIBRARY=$($crypto.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_USE_STATIC_LIBS=TRUE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_MSVC_STATIC_RT=TRUE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using prebuilt OpenSSL: $($crypto.FullName)"

      - name: Configure Windows x64 game
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DOPENSSL_INCLUDE_DIR="$env:OPENSSL_INCLUDE_DIR" -DOPENSSL_CRYPTO_LIBRARY="$env:OPENSSL_CRYPTO_LIBRARY" -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Compile game and tools on Windows
        run: cmake --build build --config Release --parallel

      - name: Stage game files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force launcher-resources/game | Out-Null
          Copy-Item build/Release/irantheft.exe launcher-resources/game/
          Copy-Item build/game.iremg launcher-resources/game/
          Copy-Item build/assets launcher-resources/game/ -Recurse
          Copy-Item build/Release/ires_editor.exe launcher-resources/game/
          Copy-Item build/Release/ires_packer.exe launcher-resources/game/
          Copy-Item build/Release/ires_signer.exe launcher-resources/game/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install Tauri dependencies
        working-directory: launcher-ui
        run: npm install

      - name: Build Tauri launcher and NSIS installer
        working-directory: launcher-ui
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: IRAntheft-Windows-x64-Setup
          path: launcher-ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
